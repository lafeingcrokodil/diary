# Dependabot version updates. Security updates are configured separately in
# the repository settings, and aren't affected by the options below.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]

  # pnpm uses the npm ecosystem.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in web/pnpm-workspace.yaml, so that Dependabot
    # doesn't propose versions that pnpm would refuse to install.
    cooldown:
      default-days: 14
    groups:
      web:
        update-types: [minor, patch]
