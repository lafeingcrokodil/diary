name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Go code embeds the built front end, which these jobs don't need, so
      # a placeholder is enough for it to compile.
      - run: make web/build/index.html
      - run: go vet ./...
      # The Firestore tests run against the Firestore emulator, which needs
      # Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Start the Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:8085 &
          # Wait for it to accept requests.
          for attempt in $(seq 30); do
            curl --fail --silent localhost:8085 && break
            sleep 1
          done
          curl --fail --silent --show-error localhost:8085
      - run: make cover
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Go code embeds the built front end, which these jobs don't need, so
      # a placeholder is enough for it to compile.
      - run: make web/build/index.html
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version mentioned in the README.
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag diary .
      - name: Check that the image serves the app
        run: |
          # The server requires its auth and Firestore configuration, but
          # these checks don't call the API, so any values will do. (With
          # FIRESTORE_EMULATOR_HOST set, the server doesn't need Google Cloud
          # credentials, and nothing needs to listen there.)
          docker run --detach --publish 8080:8080 \
            --env FIREBASE_PROJECT_ID=test \
            --env ALLOWED_EMAILS=nobody@example.com \
            --env FIRESTORE_EMULATOR_HOST=localhost:8085 \
            diary
          # Give the server a few seconds to start.
          for attempt in 1 2 3 4 5; do
            curl --fail --silent localhost:8080/health && break
            sleep 1
          done
          curl --fail --silent --show-error localhost:8080/health
          curl --fail --silent --show-error localhost:8080/ | grep --quiet '<html'

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      # Validation doesn't need access to the state bucket.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    # Deploy every push to main, once all other jobs have passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, web, image, terraform]
    runs-on: ubuntu-latest
    # Run one deployment at a time, so that an older commit can't overwrite a
    # newer one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the job request GitHub's OIDC token, which workload identity
      # federation exchanges for Google Cloud credentials.
      id-token: write
    env:
      IMAGE: europe-west9-docker.pkg.dev/lafeingcrokodil-diary/main/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet
      - run: docker build --tag "$IMAGE" .
      - run: docker push "$IMAGE"
      - run: >-
          gcloud run services update app
          --project=lafeingcrokodil-diary
          --region=europe-west9
          --image="$IMAGE"
