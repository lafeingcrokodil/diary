name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Go code embeds the built front end, which these jobs don't need, so
      # a placeholder is enough for it to compile.
      - run: make web/build/index.html
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Go code embeds the built front end, which these jobs don't need, so
      # a placeholder is enough for it to compile.
      - run: make web/build/index.html
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version mentioned in the README.
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag diary .
      - name: Check that the image serves the app
        run: |
          docker run --detach --publish 8080:8080 diary
          # Give the server a few seconds to start.
          for attempt in 1 2 3 4 5; do
            curl --fail --silent localhost:8080/healthz && break
            sleep 1
          done
          curl --fail --silent --show-error localhost:8080/healthz
          curl --fail --silent --show-error localhost:8080/ | grep --quiet '<html'

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      # Validation doesn't need access to the state bucket.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
