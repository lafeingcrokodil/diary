version: "2"

linters:
  # Start with every linter enabled, then disable the ones we decide we don't
  # want, with a comment explaining why.
  default: all
  disable:
    # Deprecated in favour of exhaustruct_v5, gomodguard_v2 and wsl_v5.
    - exhaustruct
    - gomodguard
    - wsl
    # Requiring every struct field to be set makes literals of external types
    # (e.g. http.Server) noisy, and we rely on zero values.
    - exhaustruct_v5
    # Without explicit rules, depguard only allows the standard library, which
    # would even block imports of our own packages. New dependencies get
    # reviewed in PRs anyway.
    - depguard
    # Requiring a blank line before every return adds noise to short
    # functions without making them easier to read. (wsl_v5's return check
    # is disabled below for the same reason.)
    - nlreturn
    # Checking an error inline (if err := f(); err != nil) keeps err scoped to
    # the check, which is the idiomatic style when a call only returns an
    # error.
    - noinlineerr
  settings:
    varnamelen:
      # "id" is as clear as a longer name would be.
      ignore-names:
        - id
    wsl_v5:
      disable:
        - return
  exclusions:
    rules:
      # Table-driven tests repeat paths and test names in their cases, which
      # are easier to read as literals than as constants, and they grow with
      # each case, so splitting them up to stay within a length limit doesn't
      # make them easier to follow.
      - path: _test\.go
        linters:
          - funlen
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
