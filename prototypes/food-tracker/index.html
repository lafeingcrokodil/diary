<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1f1c;--muted:#6b6f68;--line:#e6e4dd;
  --accent:#2f7d5b;--accent-soft:#e3f1ea;--warn:#c47a12;--warn-soft:#fbeed8;--bad:#b9473a;--bad-soft:#f8e2df;
  --zone:#cfe8da;--bar:#2f7d5b;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141613;--card:#1d201c;--ink:#ecebe6;--muted:#9a9e96;--line:#2e322d;
  --accent:#5fbf8f;--accent-soft:#1f3328;--warn:#e3a547;--warn-soft:#3a2e1a;--bad:#e2796c;--bad-soft:#3b2220;
  --zone:#244533;--bar:#5fbf8f;--shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 150px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px;min-height:36px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.datenav{display:flex;align-items:center;gap:4px}
.datenav span{min-width:104px;text-align:center;font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:36px;height:36px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
.icon-btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;vertical-align:1px}
.ok{background:var(--accent-soft);color:var(--accent)}.lo{background:var(--warn-soft);color:var(--warn)}.hi{background:var(--bad-soft);color:var(--bad)}.na{background:var(--line);color:var(--muted)}
.meter{position:relative;height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0 4px}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--zone)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:99px;opacity:.9}
.meter .fill.hi{background:var(--bad)}
.meter .mid{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.55}
.nut{margin-bottom:12px}.nut:last-child{margin-bottom:0}
.nut .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nut .row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.warnbox{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],input[type=url],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input:disabled,select:disabled{opacity:.6}
textarea{min-height:86px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;margin-top:8px}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.entry:first-child{border-top:none;padding-top:0}
.entry .n{flex:1;min-width:0}.entry .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.entry .k{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;border:none;border-radius:99px;padding:13px 24px;font-weight:600;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;z-index:5}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar a{flex:1;max-width:120px;text-align:center;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
nav.tabbar a .ic{display:block;font-size:19px;line-height:1.2}
nav.tabbar a.on{color:var(--accent);font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));z-index:11;display:none;max-width:620px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:block}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sheet-head h2{margin:0;font-size:17px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:16px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:none}
.li .sub{font-size:12px;color:var(--muted)}
.li .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}
.est-row{display:grid;grid-template-columns:1fr 74px 56px 28px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.est-row:first-child{border-top:none}
.est-row input{padding:6px 8px}
.note{font-size:13px;background:var(--bg);border-radius:10px;padding:10px;margin-top:10px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--bar);min-height:2px}
.hist .b.lo{background:var(--warn)}.hist .b.hi{background:var(--bad)}.hist .b.none{background:var(--line)}
.hist .t{font-size:11px;color:var(--muted)}
.trend-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 2px 10px}
.trend-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--card);font-weight:600}
.card h2 .chg{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.plot{position:relative;height:130px;margin:8px 0 0 42px}
.plot .yl{position:absolute;left:-42px;width:36px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums;line-height:1}
.plot .gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.plot .gl.zero{background:var(--muted);opacity:.7}
.nh{position:absolute;inset:0;display:flex}
.nh .col{flex:1;position:relative;cursor:pointer}
.nh .band{position:absolute;left:0;right:0;background:var(--zone);opacity:.75}
.nh .b{position:absolute;left:14%;right:14%;background:var(--bar);min-height:2px;border-radius:3px}
.nh.dense .b{left:8%;right:8%;border-radius:1px}
.nh .b.lo{background:var(--warn)}.nh .b.hi{background:var(--bad)}.nh .b.none{background:var(--muted);opacity:.5}
.xax{display:flex;justify-content:space-between;margin:5px 0 0 42px;font-size:11px;color:var(--muted)}
.xax.days span{flex:1;text-align:center}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wd{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--card);transform:translate(-50%,-50%);box-sizing:content-box;cursor:pointer}
.wd.sm{width:5px;height:5px;border-width:1.5px}
.rv-src{margin:-4px 0 4px;font-size:14px}
.rv-ing{display:flex;gap:12px;align-items:baseline;padding:11px 2px;border-top:1px solid var(--line);font-size:17px;line-height:1.4;cursor:pointer}
.rv-ing:first-child{border-top:none}
.rv-ing .amt{flex:none;width:96px;font-weight:600;font-variant-numeric:tabular-nums}
.rv-ing .amt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rv-ing .nt{font-size:14px;color:var(--muted)}
.rv-step{display:flex;gap:12px;padding:13px 2px;border-top:1px solid var(--line);font-size:17px;line-height:1.55;cursor:pointer}
.rv-step:first-child{border-top:none}
.rv-step .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.rv-ing.done,.rv-step.done{opacity:.45}
.rv-ing.done .nm,.rv-step.done .tx{text-decoration:line-through}
.rv-notes{font-size:16px;line-height:1.55;white-space:pre-wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none!important}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
img.preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:10px;display:block}
.ing{display:grid;grid-template-columns:1fr 70px 88px 28px;gap:6px;align-items:center;margin-bottom:6px}
.ing .note-in{grid-column:1/4}
.ingblock{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ingblock:first-child{border-top:none;margin-top:0;padding-top:0}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.photos .ph{position:relative}.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}.photos .ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;line-height:1;padding:0}
.li img.th{width:40px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.serv{display:grid;grid-template-columns:1fr 90px 28px;gap:6px;margin-bottom:6px;align-items:center}
.nrow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-bottom:6px}
.trow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;margin-bottom:6px}
.shop{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:none}
.shop.done .t{text-decoration:line-through;color:var(--muted)}
.shop .t{flex:1}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>

/* ======================= Storage ======================= */
// Account storage: data/users/<id>/app/<collection>/<doc>. Fallback: this browser only.
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const store={
  base:null, oldCol:null,
  lmap(c){return lsGet("ft2:"+c)||{}},
  async all(c){
    if(this.base){const q=await this.base.collection(c).get();return q.docs.map(d=>clone(d.data()));}
    return Object.values(this.lmap(c));
  },
  async get(c,id){
    if(this.base){const s=await this.base.collection(c).doc(id).get();return s.exists?clone(s.data()):null;}
    return this.lmap(c)[id]||null;
  },
  async where(c,field,op,val){
    if(this.base){const q=await this.base.collection(c).where(field,op,val).get();return q.docs.map(d=>clone(d.data()));}
    return Object.values(this.lmap(c)).filter(d=>op==="array-contains"?(d[field]||[]).includes(val):op===">="?d[field]>=val:d[field]===val);
  },
  _w:{},_q:{},
  async put(c,id,v){
    if(!this.base){const m=this.lmap(c);m[id]=v;lsSet("ft2:"+c,m);return;}
    const key=c+"/"+id;this._q[key]=clone(v);
    if(this._w[key])return;this._w[key]=true;
    while(this._q[key]!==undefined){const val=this._q[key];delete this._q[key];
      try{await this.base.collection(c).doc(id).set(val);syncNote(true);}catch(e){syncNote(false,e);}}
    this._w[key]=false;
  },
  async del(c,id){
    if(!this.base){const m=this.lmap(c);delete m[id];lsSet("ft2:"+c,m);return;}
    try{await this.base.collection(c).doc(id).delete();}catch(e){syncNote(false,e);}
  }
};

/* ======================= Nutrition maths ======================= */
// Totals: {kcal, n:{id:{v,inc}}, inc (energy incomplete)}
function emptyTotals(){const t={kcal:0,inc:false,n:{}};for(const n of activeNuts())t.n[n.id]={v:0,inc:false};return t;}
function addInto(t,o,f=1){t.kcal+=o.kcal*f;t.inc=t.inc||o.inc;for(const id in t.n){const x=o.n[id];if(!x){t.n[id].inc=true;continue;}t.n[id].v+=x.v*f;t.n[id].inc=t.n[id].inc||x.inc;}}
function baseAmount(food,amount,serving){
  if(!serving)return amount;
  const s=(food.servings||[]).find(s=>s.name===serving);return s?amount*s.amount:null;
}
function foodTotals(food,base){
  const t=emptyTotals();
  if(!food||base==null){t.inc=true;for(const id in t.n)t.n[id].inc=true;return t;}
  t.kcal=(food.kcalPer100||0)*base/100;
  for(const id in t.n){const v=food.nutrients?.[id];if(v==null||v==="")t.n[id].inc=true;else t.n[id].v=v*base/100;}
  return t;
}
function recipeTotals(r){
  const t=emptyTotals();
  for(const ing of r.ingredients||[]){const f=getFood(ing.food);addInto(t,foodTotals(f,f?baseAmount(f,ing.amount,ing.serving):null));}
  return t;
}
function entryTotals(e){
  if(e.kind==="recipe"){const r=getRecipe(e.ref);const t=emptyTotals();if(!r){t.inc=true;return t;}addInto(t,recipeTotals(r),e.amount);return t;}
  const f=getFood(e.ref);return foodTotals(f,f?baseAmount(f,e.amount,e.serving):null);
}
function dayTotals(day){const t=emptyTotals();for(const e of day.entries)addInto(t,entryTotals(e));return t;}
function sortedEntries(day){
  const timed=day.entries.filter(e=>e.time).sort((a,b)=>a.time.localeCompare(b.time));
  return [...timed,...day.entries.filter(e=>!e.time)];
}
function entryLabel(e){
  if(e.kind==="recipe"){const r=getRecipe(e.ref);return {name:r?r.name:"(missing recipe)",amt:fracText(e.amount)+" of recipe"};}
  const f=getFood(e.ref);if(!f)return {name:"(missing food)",amt:""};
  return {name:f.name+(f.brand?" · "+f.brand:""),amt:e.serving?`${fmt(e.amount)} × ${e.serving}`:`${fmt(e.amount)} ${f.unit}`};
}
function fracText(x){const m={0.25:"¼",0.5:"½",0.75:"¾",1:"whole"};if(m[x])return m[x];if(Math.abs(x-1/3)<.01)return "⅓";if(Math.abs(x-2/3)<.01)return "⅔";return fmt(x);}

/* ======================= Energy expended & body weight ======================= */
function weightFor(date){
  const d=S.days[date];if(d&&d.weight!=null)return {kg:d.weight,date};
  let best=null;for(const k in S.days){const x=S.days[k];if(x.weight!=null&&k<date&&(!best||k>best.date))best={kg:x.weight,date:k};}
  const lw=S.settings?.lastWeight;if(lw&&lw.date<=date&&(!best||lw.date>best.date))best={kg:lw.kg,date:lw.date};
  if(!best&&S.settings?.fallbackWeight)best={kg:S.settings.fallbackWeight,date:null};
  return best;
}
function estimateBurn(day){
  const s=S.settings||{},w=weightFor(day.date);
  if(!s.age||!s.height||!w)return null;
  const bmr=10*w.kg+6.25*s.height-5*s.age-161;
  const base=bmr*1.2,steps=(day.steps||0)*0.0004*w.kg,boulder=day.boulder?4.0*w.kg*(day.boulderH||0):0;
  return {bmr,base,steps,boulder,total:base+steps+boulder};
}
function ctxFor(day){
  const est=estimateBurn(day),w=weightFor(day.date);
  const expended=day.expended!=null?day.expended:est?est.total:null;
  return {expended,expSrc:day.expended!=null?"entered":est?"estimated":null,est,weight:w?w.kg:null,weightFrom:w};
}

/* ======================= Targets ======================= */
// t = {minDay,maxDay,minPct,maxPct,minKg,maxKg}; kcalPerGram null for energy itself (pct of expended directly)
const TKEYS=[["minDay","maxDay","per day"],["minPct","maxPct","% of energy expended"],["minKg","maxKg","per kg body weight"]];
function effRange(t,ctx,energy,kpg){
  if(!t)return null;
  const mins=[],maxs=[],skipped=[];
  const conv={Day:v=>v,Pct:v=>energy?v/100*ctx.expended:(kpg?v/100*ctx.expended/kpg:null),Kg:v=>v*ctx.weight};
  const ok={Day:true,Pct:ctx.expended!=null&&(energy||!!kpg),Kg:ctx.weight!=null};
  for(const kind of["Day","Pct","Kg"])for(const mm of["min","max"]){
    const v=t[mm+kind];if(v==null)continue;
    if(!ok[kind]){skipped.push(mm+kind);continue;}
    (mm==="min"?mins:maxs).push(conv[kind](v));
  }
  if(!mins.length&&!maxs.length)return skipped.length?{lo:null,hi:null,skipped}:null;
  const lo=mins.length?Math.max(...mins):null,hi=maxs.length?Math.min(...maxs):null;
  return {lo,hi,conflict:lo!=null&&hi!=null&&lo>hi,skipped};
}
function statusOf(v,R){if(!R||(R.lo==null&&R.hi==null)||R.conflict)return "na";if(R.lo!=null&&v<R.lo)return "lo";if(R.hi!=null&&v>R.hi)return "hi";return "ok";}
function targetSummary(t,unit,energy){
  if(!t)return "No targets";const parts=[];
  for(const[a,b,lab] of TKEYS){const lo=t[a],hi=t[b];if(lo==null&&hi==null)continue;
    const u=a==="minPct"?"%":a==="minKg"?` ${unit}/kg`:` ${unit}`;
    parts.push((lo!=null&&hi!=null?`${fmt(lo)}–${fmt(hi)}`:lo!=null?`≥ ${fmt(lo)}`:`≤ ${fmt(hi)}`)+u+(a==="minPct"?(energy?" of expended":" of energy"):a==="minDay"?"/day":""));}
  return parts.length?parts.join(" · "):"No targets";
}

function bar(v,R,energy){
  if(!R||(R.lo==null&&R.hi==null)||R.conflict)return "";
  let max,lo=R.lo??0,hi=R.hi;
  if(R.lo!=null){max=Math.max(R.lo*2,hi!=null?hi*1.1:0);}else{max=hi/0.75;}
  const zoneR=hi!=null?Math.min(hi,max):max;
  const st=statusOf(v,R);
  return `<div class="meter"><div class="zone" style="left:${lo/max*100}%;width:${(zoneR-lo)/max*100}%"></div>${R.lo!=null?`<div class="mid" style="left:calc(${R.lo/max*100}% - 1px)"></div>`:""}<div class="fill ${st==="hi"?"hi":""}" style="width:${Math.min(100,v/max*100)}%"></div></div>`;
}
function rangeText(R,unit){
  if(!R)return "";if(R.conflict)return "";
  if(R.lo!=null&&R.hi!=null)return `${fmt(R.lo,unit)}–${fmt(R.hi,unit)} ${unit}`;
  if(R.lo!=null)return `at least ${fmt(R.lo,unit)} ${unit}`;if(R.hi!=null)return `at most ${fmt(R.hi,unit)} ${unit}`;return "";
}
function nutRow(label,v,inc,unit,R){
  const st=statusOf(v,R);
  const pill=st==="na"?"":`<span class="pill ${st}">${st==="ok"?"✓":st==="lo"?"low":"high"}</span>`;
  const rt=rangeText(R,unit);
  let sub=rt;
  if(R&&R.conflict)sub="";
  if(R&&R.skipped&&R.skipped.length&&!rt&&!R.conflict)sub=`Targets need ${R.skipped.some(k=>k.endsWith("Kg"))?"your body weight":""}${R.skipped.some(k=>k.endsWith("Kg"))&&R.skipped.some(k=>k.endsWith("Pct"))?" and ":""}${R.skipped.some(k=>k.endsWith("Pct"))?"energy expended":""}`;
  return `<div class="nut"><div class="row"><span>${esc(label)} ${pill}</span><b>${inc?"≥ ":""}${fmt(v,unit)} ${esc(unit)}</b></div>${bar(v,R)}
    <div class="tiny muted">${esc(sub)}${inc?`${sub?" · ":""}incomplete: some foods have no value for this`:""}</div>
    ${R&&R.conflict?`<div class="warnbox">Targets conflict: minimum ${fmt(R.lo,unit)} is above maximum ${fmt(R.hi,unit)} ${esc(unit)}. Check them on the Nutrients page.</div>`:""}</div>`;
}

/* ======================= Trends (net energy & body weight) ======================= */
const RANGES=[7,30,90];
S.range=RANGES.includes(lsGet("ft2:ui:range"))?lsGet("ft2:ui:range"):7;
S.loadedFrom=null;let loadingFrom=null;
// Loads saved days from `from` onwards, keeping days already in memory (they may have unsaved changes).
async function ensureDays(from){
  if(S.loadedFrom&&from>=S.loadedFrom||loadingFrom&&from>=loadingFrom)return;
  loadingFrom=from;
  let ok=false;
  try{const got=await store.where("days","date",">=",from);for(const d of got)if(!S.days[d.date])S.days[d.date]=d;S.loadedFrom=from;ok=true;}catch(e){}
  loadingFrom=null;if(!ok)return;
  const a=document.activeElement;
  if(S.page==="diary"&&!(a&&$("#app").contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render();
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
const shortDate=k=>new Date(k+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
function xAxis(days){
  if(days.length<=7)return `<div class="xax days">${days.map(k=>`<span>${new Date(k+"T12:00").toLocaleDateString("en-GB",{weekday:"narrow"})}</span>`).join("")}</div>`;
  return `<div class="xax"><span>${shortDate(days[0])}</span><span>${shortDate(days[Math.floor(days.length/2)])}</span><span>${shortDate(days[days.length-1])}</span></div>`;
}
function trendCards(){
  const days=[];for(let i=S.range-1;i>=0;i--)days.push(addDays(S.date,-i));
  ensureDays(days[0]);
  return `<div class="trend-head"><h2>Trends</h2><div class="seg" role="group" aria-label="Time span">${RANGES.map(n=>`<button data-act="range" data-id="${n}" class="${n===S.range?"on":""}" aria-pressed="${n===S.range}">${n} days</button>`).join("")}</div></div>
  ${netCard(days)}${weightCard(days)}`;
}
// Net energy is eaten minus expended. Bars are coloured by whether energy eaten is within the energy target range.
function netCard(days){
  const rows=days.map(k=>{const d=S.days[k];if(!d||!d.entries.length)return {k};
    const t=dayTotals(d),c=ctxFor(d),R=effRange(S.settings.energyTargets,c,true);
    let st=statusOf(t.kcal,R);if(st==="na")st="ok";
    if(c.expended==null)return {k,t,st,net:null};
    const band=R&&!R.conflict&&(R.lo!=null||R.hi!=null)?{lo:R.lo!=null?R.lo-c.expended:null,hi:R.hi!=null?R.hi-c.expended:null}:null;
    return {k,t,st,net:t.kcal-c.expended,band,exp:c.expended,src:c.expSrc};});
  const logged=rows.filter(r=>r.t),withNet=rows.filter(r=>r.net!=null);
  if(!logged.length)return `<div class="card"><h2>Net energy</h2><div class="empty">No food logged in the last ${S.range} days.</div></div>`;
  const vals=[0];for(const r of withNet){vals.push(r.net);if(r.band){if(r.band.lo!=null)vals.push(r.band.lo);if(r.band.hi!=null)vals.push(r.band.hi);}}
  let top=Math.max(...vals),bot=Math.min(...vals);
  const step=niceStep(Math.max(top-bot,400)/4);top=Math.ceil(top/step)*step;bot=Math.floor(bot/step)*step;if(top===bot)top=bot+step;
  const y=v=>(top-v)/(top-bot)*100;
  const sign=v=>(v>0?"+":v<0?"−":"")+fmt(Math.abs(v),"kcal");
  const cols=rows.map(r=>{let inner="",tip=fmtDate(r.k);
    if(r.t&&r.net==null){inner=`<div class="b none" style="top:calc(${y(0)}% - 1px);height:3px;min-height:0"></div>`;tip+=`: ${fmt(r.t.kcal,"kcal")} kcal eaten, energy expended unknown`;}
    else if(r.t){
      if(r.band){const a=y(r.band.hi!=null?r.band.hi:top),b=y(r.band.lo!=null?r.band.lo:bot);inner+=`<div class="band" style="top:${a}%;height:${b-a}%"></div>`;}
      const a=y(Math.max(r.net,0)),b=y(Math.min(r.net,0));
      inner+=`<div class="b ${r.st}" style="top:${a}%;height:${b-a}%"></div>`;
      tip+=`: net ${sign(r.net)} kcal (${fmt(r.t.kcal,"kcal")} eaten − ${fmt(r.exp,"kcal")} ${r.src==="estimated"?"estimated ":""}expended)`;}
    return `<div class="col" data-act="goDay" data-id="${r.k}" title="${esc(tip)}">${inner}</div>`;}).join("");
  const labels=[[top,sign(top)],[0,"0"],[bot,sign(bot)]].filter(([v],i)=>i===1||Math.abs(y(v)-y(0))>14);
  const inR=logged.filter(r=>r.st==="ok").length;
  const avg=withNet.length?withNet.reduce((a,r)=>a+r.net,0)/withNet.length:null;
  return `<div class="card"><h2><span>Net energy</span>${avg!=null?`<span class="chg">avg ${sign(avg)} kcal/day</span>`:""}</h2>
    <div class="plot">${labels.map(([v,l])=>`<div class="gl ${v===0?"zero":""}" style="top:${y(v)}%"></div><div class="yl" style="top:${y(v)}%">${l}</div>`).join("")}<div class="nh ${days.length>7?"dense":""}">${cols}</div></div>
    ${xAxis(days)}
    <div class="legend"><span><i style="background:var(--bar)"></i>In range</span><span><i style="background:var(--warn)"></i>Under</span><span><i style="background:var(--bad)"></i>Over</span><span><i style="background:var(--zone)"></i>Target range</span></div>
    <div class="tiny muted" style="margin-top:6px">Net = eaten − expended. Colours compare energy eaten with your target. ${logged.length} day${logged.length>1?"s":""} logged · in range on ${inR}${logged.length>withNet.length?` · ${logged.length-withNet.length} without energy expended`:""}.</div></div>`;
}
const onDate=k=>k===today()?"today":k===addDays(today(),-1)?"yesterday":"on "+fmtDate(k);
function weightCard(days){
  const n=days.length,pts=days.map((k,i)=>({i,k,kg:S.days[k]?.weight})).filter(p=>p.kg!=null);
  if(!pts.length)return `<div class="card"><h2>Body weight</h2><div class="empty">No weight logged in the last ${n} days.</div></div>`;

  const x=i=>(i+.5)/n*100,y=v=>(hi-v)/(hi-lo)*100;

/* ======================= Backup to Google Drive ======================= */
const DRIVE="Google Drive",BACKUP_FOLDER="Diary Backups",INLINE_MAX=900000;
let mcp=null,backupFolderId=null;
async function collectBackup(){
  const [settings,nutrients,foods,recipes,lists,days]=await Promise.all([store.get("settings","main"),store.all("nutrients"),store.all("foods"),store.all("recipes"),store.all("lists"),store.all("days")]);
  days.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return {app:"Diary",exportedAt:new Date().toISOString(),settings,nutrients,foods,recipes,lists,days};
}
// Finds the backup folder at the top of My Drive, creating it on first use.
async function backupFolder(){
  if(backupFolderId)return backupFolderId;
  const q=`title = '${BACKUP_FOLDER}' and mimeType = 'application/vnd.google-apps.folder' and parentId = 'root' and trashed = false`;
  const found=(await mcp.callTool(DRIVE,"search_files",{query:q,excludeContentSnippets:true,pageSize:1},{cache:false})).payload;
  let id=found&&found.files&&found.files[0]&&found.files[0].id;
  if(!id){const made=(await mcp.callTool(DRIVE,"create_file",{title:BACKUP_FOLDER,contentMimeType:"application/vnd.google-apps.folder"})).payload;id=made&&(made.id||made.file&&made.file.id);}
  if(!id)throw {code:"no_folder"};
  return backupFolderId=id;
}
function driveErr(e,stage){
  switch(e&&e.code){
    case "needs_reauth":return "Your Google Drive connection has expired. Reconnect Google Drive in claude.ai Settings → Connectors, then try again.";
    case "server_not_connected":case "server_not_found":return "Google Drive isn't connected. Add it in claude.ai Settings → Connectors, then try again.";
    case "selection_required":return "You have more than one Google Drive connector. Choose one when claude.ai asks, then try again.";
    case "approval_required":case "consent_required":return "Saving to Drive needs your approval. claude.ai asks for it when you tap the button with the page open there.";
    case "not_in_manifest":case "not_granted":return "Google Drive isn't allowed for this page. Turn it on in the page's Permissions menu, then try again.";
    case "blocked_by_policy":return "Your organization's settings don't allow this page to use Google Drive.";
    case "too_large":return "Your data is too large to upload from this view.";
    case "no_folder":return `Couldn't find or create the “${BACKUP_FOLDER}” folder in Drive.`;
    case "tool_error":return "Google Drive refused the upload"+(e.message?": "+String(e.message).slice(0,200):".");
    case "capability_disabled":case "capability_removed":return "Google Drive can't be used in this view.";
    default:return stage==="upload"?`The backup may or may not have been saved. Check the “${BACKUP_FOLDER}” folder in Drive before trying again.`:"Couldn't reach Google Drive just now. Try again in a moment.";
  }
}
async function backupToDrive(btn,out){
  btn.disabled=true;spin(out,"Backing up…");let stage="prepare";
  try{
    const json=JSON.stringify(await collectBackup());
    const d=new Date(),title=`Diary backup ${ds(d)} ${pad(d.getHours())}-${pad(d.getMinutes())}.json`;
    const input={title,contentMimeType:"application/json",disableConversionToGoogleType:true};
    if(new Blob([json]).size<=INLINE_MAX)input.textContent=json;
    else{let fileArgs=false;try{fileArgs=!!(await mcp.listTools()).fileArgs;}catch(e){}
      if(!fileArgs)throw {code:"too_large"};
      input.base64Content={$file:{data:new Blob([json],{type:"application/json"}),name:"diary-backup.json",type:"application/json"}};}
    stage="folder";input.parentId=await backupFolder();
    stage="upload";const f=(await mcp.callTool(DRIVE,"create_file",input)).payload||{};
    const url=f.viewUrl||(f.file&&f.file.viewUrl);
    out.innerHTML=`<div class="note">Saved “${esc(title)}” to the “${esc(BACKUP_FOLDER)}” folder.${url&&/^https:\/\//.test(url)?` <a href="${esc(url)}" target="_blank" rel="noopener">Open in Drive</a>`:""}</div>`;
  }catch(e){if(stage==="folder")backupFolderId=null;out.innerHTML=`<div class="warnbox">${esc(driveErr(e,stage))}</div>`;}
  btn.disabled=false;
}

function nutList(){return activeNuts().map(n=>({id:n.id,name:n.name,unit:n.unit}));}
function parseJSON(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error("nojson");return JSON.parse(m[0]);}
function spin(el,msg){el.innerHTML=`<div class="note"><span class="spinner"></span>${msg}</div>`;}
function errMsg(e){return e&&e.code==="rate_limited"?"Claude is busy — try again in a minute.":e&&e.code==="not_granted"?"Claude access wasn't allowed for this page.":"Couldn't get an estimate — try again or add more detail.";}
async function ask(prompt,images){const opts={modelTier:"default"};if(images&&images.length)opts.images=images;const r=await sample(prompt,opts);return parseJSON(r.text);}
async function shrink(file,max=1280){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));}finally{setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
/* ======================= Usage checks (protection) ======================= */
async function foodUsage(id){
  const recipes=S.recipes.filter(r=>(r.ingredients||[]).some(i=>i.food===id));
  let days=[];try{days=await store.where("days","foodIds","array-contains",id);}catch(e){days=null;}
  const servings=new Set();
  recipes.forEach(r=>r.ingredients.forEach(i=>{if(i.food===id&&i.serving)servings.add(i.serving);}));
  (days||[]).forEach(d=>(d.servingRefs||[]).forEach(s=>{const[f,...n]=s.split("|");if(f===id)servings.add(n.join("|"));}));
  // also the day currently in memory (unsaved writes)
  Object.values(S.days).forEach(d=>d.entries.forEach(e=>{if(e.kind==="food"&&e.ref===id){if(days&&!days.some(x=>x.date===d.date))days.push(d);if(e.serving)servings.add(e.serving);}}));
  return {recipes,days,servings,used:recipes.length>0||days===null||days.length>0};
}
async function recipeUsage(id){
  let days=[];try{days=await store.where("days","recipeIds","array-contains",id);}catch(e){days=null;}
  Object.values(S.days).forEach(d=>{if(d.entries.some(e=>e.kind==="recipe"&&e.ref===id)&&days&&!days.some(x=>x.date===d.date))days.push(d);});
  return {days,used:days===null||days.length>0};
}

function listHeader(title,kind,newLabel){
  return `<header><h1>${title}</h1><button class="btn primary sm" data-act="new-${kind}">+ ${newLabel}</button></header>
  <div class="card"><input type="search" placeholder="Search" data-inp="search" data-kind="${kind}" value="${esc(S.search?.[kind+"s"]||"")}">
  <div class="check"><input type="checkbox" id="arch-${kind}" data-inp="arch" data-kind="${kind}" ${S.showArchived[kind+"s"]?"checked":""}><label for="arch-${kind}" class="small">Show archived</label></div>`;
}
S.search={};
function renderFoods(){
  const q=norm(S.search.foods),arch=S.showArchived.foods;
  const list=S.foods.filter(f=>(arch?f.archived:!f.archived)&&(!q||norm(f.name+" "+(f.brand||"")).includes(q))).sort(byName);
  return listHeader("Foods","food","New food")+`<div id="listBody" style="margin-top:8px">${list.length?list.map(f=>{const known=activeNuts().filter(n=>f.nutrients?.[n.id]!=null).length;
    return `<div class="li" data-act="editFood" data-id="${f.id}"><div><div>${esc(f.name)}${f.brand?` <span class="sub">${esc(f.brand)}</span>`:""}</div><div class="sub">${fmt(f.kcalPer100,"kcal")} kcal / 100 ${f.unit}${f.servings?.length?" · "+f.servings.map(s=>esc(s.name)).join(", "):""}${known<activeNuts().length?` · ${activeNuts().length-known} nutrient${activeNuts().length-known>1?"s":""} unknown`:""}</div></div><div class="sub">›</div></div>`;}).join("")
    :`<div class="empty">${arch?"No archived foods.":"No foods yet. Add one here, or log something from the diary — common foods, label photos and barcodes are saved here automatically."}</div>`}</div></div>`;
}
async function openFoodEditor(id){
  const orig=id?getFood(id):null;
  const f=orig?clone(orig):{id:"f"+uid(),name:"",brand:"",unit:"g",kcalPer100:null,servings:[],nutrients:{},archived:false,barcode:null};

  const u=orig?await foodUsage(id):{used:false,servings:new Set(),recipes:[],days:[]};
  const photos=[]; // {blob,url} — only kept while the editor is open
  let estNote="";
  const estTag=k=>(f.estimated||[]).includes(k)?' <span class="pill na">estimated</span>':"";
  const draw=()=>{
    openSheet(orig?"Edit food":"New food",`

      <div><label class="f">Unit</label><select id="fUnit" ${u.used?"disabled":""}><option value="g" ${f.unit==="g"?"selected":""}>grams (g)</option><option value="ml" ${f.unit==="ml"?"selected":""}>millilitres (ml)</option></select></div>
      <div><label class="f">Energy (kcal per 100 <span class="uu">${f.unit}</span>)${estTag("kcal")}</label><input type="text" inputmode="decimal" autocomplete="off" id="fKcal" value="${f.kcalPer100??""}"></div>
      <div><label class="f">Barcode (optional)</label><input type="text" id="fBarcode" inputmode="numeric" value="${esc(f.barcode||"")}"></div></div>
      <label class="f" style="margin-top:8px" for="fIng">Description or ingredients (optional)</label><textarea id="fIng" style="min-height:64px" placeholder="e.g. the menu description of a dish, or the ingredient list (Zutaten) from a package">${esc(f.ingredients||"")}</textarea>
      ${sample?`<button class="btn sm primary" id="fEst" style="margin-top:8px">Estimate blank values with Claude</button>`:""}
      <div id="fEstOut">${estNote?`<div class="note">${estNote}</div>`:""}</div>
      ${u.used?`<div class="tiny muted" style="margin-top:6px">Used in ${esc(usageText(u))}, so the unit can't be changed and the servings those use can't be removed. Renaming a serving updates them too.</div>`:""}
      <div class="sec">Servings</div><div id="servs">${f.servings.map((s,i)=>{const locked=u.servings.has(s.name);
        return `<div class="serv"><input type="text" data-si="${i}" data-sk="name" value="${esc(s.name)}" placeholder="e.g. slice"><input type="text" inputmode="decimal" autocomplete="off" data-si="${i}" data-sk="amount" value="${s.amount??""}" placeholder="${f.unit}"><button class="x" data-srm="${i}" ${locked?"disabled title='In use'":""} aria-label="Remove">×</button></div>`;}).join("")}</div>
      <button class="btn sm" id="addServ">+ Serving</button>
      <div class="sec">Nutrients per 100 <span class="uu">${f.unit}</span> <span style="text-transform:none;letter-spacing:0;font-weight:400">— leave blank if unknown</span></div>
      ${activeNuts().map(n=>`<div class="nrow"><label for="fn-${n.id}">${esc(n.name)} (${esc(n.unit)})${estTag(n.id)}</label><input type="text" inputmode="decimal" autocomplete="off" id="fn-${n.id}" data-nid="${n.id}" value="${f.nutrients[n.id]??""}"></div>`).join("")||`<div class="empty">No nutrients yet — add them on the Nutrients page.</div>`}
      <div id="fErr"></div>
      <div class="btns"><button class="btn primary" id="fSave">Save</button>${orig?`<button class="btn" id="fArch">${f.archived?"Unarchive":"Archive"}</button><button class="btn danger" id="fDel" ${u.used?"disabled":""}>Delete</button>`:""}</div>
      ${orig&&u.used?`<div class="tiny muted" style="margin-top:6px">Foods in use can be archived but not deleted.</div>`:""}`,sh=>{

      const read=()=>{f.name=$("#fName",sh).value.trim();f.brand=$("#fBrand",sh).value.trim();if(!u.used)f.unit=$("#fUnit",sh).value;

        f.barcode=$("#fBarcode",sh).value.replace(/\D/g,"")||null;f.ingredients=$("#fIng",sh).value.trim();
        $$("[data-si]",sh).forEach(inp=>{const s=f.servings[+inp.dataset.si];if(inp.dataset.sk==="name")s.name=inp.value.trim();else s.amount=num(inp.value);});
        $$("[data-nid]",sh).forEach(inp=>{const id=inp.dataset.nid,v=num(inp.value);if(inp.dataset.edited||v==null)unEst(id);if(v==null)delete f.nutrients[id];else f.nutrients[id]=v;});};
      $$("[data-nid],#fKcal",sh).forEach(inp=>inp.addEventListener("input",()=>{inp.dataset.edited="1";}));
      const addPhoto=async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;read();

      if($("#fPhCam",sh))$("#fPhCam",sh).onchange=addPhoto;if($("#fPhPick",sh))$("#fPhPick",sh).onchange=addPhoto;
      $$("[data-prm]",sh).forEach(b=>b.onclick=()=>{read();const [p]=photos.splice(+b.dataset.prm,1);URL.revokeObjectURL(p.url);draw();});

        const blank=activeNuts().filter(n=>f.nutrients[n.id]==null),needKcal=f.kcalPer100==null,needPortion=!f.servings.length;
        if(!blank.length&&!needKcal&&!needPortion){out.innerHTML=`<div class="note">Nothing is blank. Clear a value to have it estimated.</div>`;return;}
        if(!f.name&&!f.ingredients&&!photos.length){out.innerHTML=`<div class="note">Add a photo, a name or a description first.</div>`;return;}
        $("#fEst",sh).disabled=true;spin(out,"Estimating…");
        const known=activeNuts().filter(n=>f.nutrients[n.id]!=null).map(n=>({name:n.name,unit:n.unit,per100:f.nutrients[n.id]}));
        try{const d=await ask(`Estimate nutrition values for a food. It may be a dish from a restaurant or café (the brand is then the restaurant), a home-made dish, or a packaged product (the description may then be its ingredient list, in descending order by weight).
Food: ${JSON.stringify({name:f.name,brandOrRestaurant:f.brand||"",descriptionOrIngredients:f.ingredients||""})}
Values already known (keep consistent with them): ${JSON.stringify({kcalPer100:f.kcalPer100,nutrientsPer100:known,servings:f.servings})}
${photos.length?`${photos.length} photo${photos.length>1?"s":""} of the food ${photos.length>1?"are":"is"} attached: use ${photos.length>1?"them":"it"} to judge the portion size and what's in it. If a nutrition table is visible, use its printed values.`:"No photo."}
Use typical German/European recipes and restaurant portions unless told otherwise, and include cooking oil, butter, sauces and dressings, which are often underestimated. A nutrient named carbohydrates means available carbohydrates excluding fibre (EU convention).
Give values per 100 ${f.unit} of the food as served${needKcal?", including energy (kcalPer100)":""}.${blank.length?` Estimate these nutrients (per 100 ${f.unit}, in the given unit): ${JSON.stringify(blank.map(n=>({id:n.id,name:n.name,unit:n.unit})))}.`:""}${needPortion?` Also estimate the total weight in ${f.unit} of one portion as shown or described (portionAmount).`:""}
Reply with ONLY JSON: {"kcalPer100":number|null,"nutrients":{"<nutrient id>":number|null},"portionAmount":number|null,"note":"one short sentence on the main assumptions"}`,photos.map(p=>p.blob));
          const filled=[];f.estimated=f.estimated||[];
          if(needKcal&&d.kcalPer100!=null&&isFinite(+d.kcalPer100)){f.kcalPer100=Math.round(+d.kcalPer100);f.estimated.push("kcal");filled.push("energy");}
          for(const n of blank){const v=d.nutrients?.[n.id];if(v!=null&&isFinite(+v)){f.nutrients[n.id]=Math.round(+v*10)/10;f.estimated.push(n.id);filled.push(n.name.toLowerCase());}}
          if(needPortion&&d.portionAmount>0){f.servings.push({name:"1 portion",amount:Math.round(+d.portionAmount)});filled.push(`a “1 portion” serving of ${Math.round(+d.portionAmount)} ${f.unit}`);}
          estNote=(filled.length?"Estimated "+esc(filled.join(", "))+". Check the values, then save.":"Claude couldn't estimate these.")+(d.note?" "+esc(d.note):"");draw();}
        catch(e){out.innerHTML=`<div class="note">${errMsg(e)}</div>`;if($("#fEst",sh))$("#fEst",sh).disabled=false;}};
      $("#fUnit",sh).onchange=()=>{$$(".uu",sh).forEach(x=>x.textContent=$("#fUnit",sh).value);};
      $("#addServ",sh).onclick=()=>{read();f.servings.push({name:"",amount:null});draw();};
      $$("[data-srm]",sh).forEach(b=>b.onclick=()=>{read();f.servings.splice(+b.dataset.srm,1);draw();});
      $("#fSave",sh).onclick=()=>{read();

      if($("#fDel",sh)&&!u.used)confirmBtn($("#fDel",sh),"Tap again to delete",()=>{S.foods=S.foods.filter(x=>x.id!==f.id);store.del("foods",f.id);closeSheet();render();});
    });
  };draw();

async function commitFood(f){
  const changes=f.servings.filter(s=>s._orig!=null&&s._orig!==s.name).map(s=>({from:s._orig,to:s.name,factor:1}));
  f.servings.forEach(s=>{delete s._orig;});
  saveFood(f);closeSheet();
  await applyServingChanges(f,changes);render();
}
// Points recipes and diary entries that use a renamed serving at its new name; factor rescales their counts.
async function applyServingChanges(food,changes){
  if(!changes.length)return;
  const match=s=>changes.find(c=>c.from===s);
  for(const r of S.recipes){let ch=false;for(const ing of r.ingredients||[]){const c=ing.food===food.id&&match(ing.serving);if(c){ing.serving=c.to;ing.amount=Math.round(ing.amount*c.factor*1000)/1000;ch=true;}}if(ch)saveRecipe(r);}
  let days=[];try{days=await store.where("days","foodIds","array-contains",food.id);}catch(e){}
  const all={};for(const d of days)all[d.date]=S.days[d.date]||d;
  for(const k in S.days)if(S.days[k].entries.some(e=>e.ref===food.id))all[k]=S.days[k];
  for(const d of Object.values(all)){let ch=false;for(const e of d.entries){const c=e.kind==="food"&&e.ref===food.id&&match(e.serving);if(c){e.serving=c.to;e.amount=Math.round(e.amount*c.factor*1000)/1000;ch=true;}}if(ch)saveDay(d);}
}
function validateFood(f,orig,u){
  if(!f.name)return "The name is required.";
  if(f.kcalPer100==null||f.kcalPer100<0)return "Energy per 100 "+f.unit+" is required and can't be negative.";
  const names=new Set();for(const s of f.servings){if(!s.name)return "Every serving needs a name.";if(!(s.amount>0))return `Serving “${s.name}” needs a positive amount.`;if(names.has(s.name))return `There's more than one serving called “${s.name}”.`;names.add(s.name);}
  for(const s of u.servings)if(!f.servings.some(x=>(x._orig??x.name)===s))return `The serving “${s}” is in use and can't be removed.`;
  for(const k in f.nutrients)if(f.nutrients[k]<0)return "Nutrient amounts can't be negative.";
  const dup=S.foods.find(x=>x.id!==f.id&&norm(x.name)===norm(f.name)&&norm(x.brand)===norm(f.brand));
  if(dup)return `You already have “${f.name}${f.brand?" · "+f.brand:""}”${dup.archived?" (archived)":""}.`;
  if(f.barcode){const b=S.foods.find(x=>x.id!==f.id&&x.barcode===f.barcode);if(b)return `Barcode ${f.barcode} already belongs to “${b.name}”.`;}
  return null;
}

function renderRecipes(){
  const q=norm(S.search.recipes),arch=S.showArchived.recipes;
  const list=S.recipes.filter(r=>(arch?r.archived:!r.archived)&&(!q||norm(r.name).includes(q))).sort(byName);
  return listHeader("Recipes","recipe","New recipe")+`<div style="margin-top:8px">${list.length?list.map(r=>{const t=recipeTotals(r);
    return `<div class="li" data-act="viewRecipe" data-id="${r.id}"><div><div>${esc(r.name)}</div><div class="sub">${(r.ingredients||[]).length} ingredient${(r.ingredients||[]).length===1?"":"s"} · ${t.inc?"≥ ":""}${fmt(t.kcal,"kcal")} kcal whole recipe</div></div><div class="sub">›</div></div>`;}).join("")
    :`<div class="empty">${arch?"No archived recipes.":"No recipes yet. Ingredients are your foods, so add those first."}</div>`}</div></div>`;
}
// Read-only view for following a recipe. Tapping an ingredient or step ticks it off; ticks last until the page is reloaded.
const recipeTicks={};
function ingAmountText(ing,f){
  if(!f)return {main:fmt(ing.amount),sub:""};
  if(!ing.serving)return {main:`${fmt(ing.amount)} ${f.unit}`,sub:""};
  const b=baseAmount(f,ing.amount,ing.serving);
  return {main:`${fmt(ing.amount)} × ${ing.serving}`,sub:b!=null?`${fmt(b)} ${f.unit}`:""};
}
function openRecipeView(id){
  const r=getRecipe(id);if(!r)return;
  const ticks=recipeTicks[id]||(recipeTicks[id]=new Set());
  const t=recipeTotals(r),ings=r.ingredients||[],steps=r.steps||[];
  openSheet(r.name,`
    ${r.archived?`<div><span class="pill na">archived</span></div>`:""}
    ${r.source&&/^https?:\/\//.test(r.source)?`<div class="rv-src"><a href="${esc(r.source)}" target="_blank" rel="noopener">Original recipe ↗</a></div>`:""}
    <div class="btns" style="margin-top:4px"><button class="btn primary sm" id="rvEdit">Edit</button><button class="btn sm" id="rvShop">Add to shopping list</button>${ticks.size?`<button class="btn sm" id="rvReset">Clear ticks</button>`:""}</div>
    <div class="sec">Ingredients</div>
    ${ings.length?`<div>${ings.map((ing,i)=>{const f=getFood(ing.food),a=ingAmountText(ing,f);
      return `<div class="rv-ing ${ticks.has("i"+i)?"done":""}" data-tick="i${i}" role="button" aria-pressed="${ticks.has("i"+i)}"><div class="amt">${esc(a.main)}${a.sub?`<small>${esc(a.sub)}</small>`:""}</div><div><div class="nm">${esc(f?f.name:"(deleted food)")}${f&&f.brand?` <span class="nt">· ${esc(f.brand)}</span>`:""}</div>${ing.note?`<div class="nt">${esc(ing.note)}</div>`:""}</div></div>`;}).join("")}</div>`:`<div class="empty">No ingredients.</div>`}
    <div class="sec">Steps</div>
    ${steps.length?`<div>${steps.map((st,i)=>`<div class="rv-step ${ticks.has("s"+i)?"done":""}" data-tick="s${i}" role="button" aria-pressed="${ticks.has("s"+i)}"><div class="no">${ticks.has("s"+i)?"✓":i+1}</div><div class="tx">${esc(st)}</div></div>`).join("")}</div>`:`<div class="empty">No steps.</div>`}
    ${r.notes?`<div class="sec">Notes</div><div class="rv-notes">${esc(r.notes)}</div>`:""}
    <div class="sec">Nutrition (whole recipe)</div>
    <div class="small muted">${ings.length?`<b style="color:var(--ink)">${t.inc?"≥ ":""}${fmt(t.kcal,"kcal")} kcal</b>`+activeNuts().map(n=>` · ${esc(n.name)} ${t.n[n.id].inc?"≥ ":""}${fmt(t.n[n.id].v,n.unit)} ${esc(n.unit)}`).join(""):"–"}</div>
    ${ings.length||steps.length?`<div class="tiny muted" style="margin-top:14px">Tap an ingredient or step to tick it off.</div>`:""}`,sh=>{
    $("#rvEdit",sh).onclick=()=>openRecipeEditor(id,()=>openRecipeView(id));
    $("#rvShop",sh).onclick=()=>openAddRecipeToList(r);
    if($("#rvReset",sh))$("#rvReset",sh).onclick=()=>{ticks.clear();keepScroll(()=>openRecipeView(id));};
    $$("[data-tick]",sh).forEach(el=>el.onclick=()=>{const k=el.dataset.tick;if(ticks.has(k))ticks.delete(k);else ticks.add(k);keepScroll(()=>openRecipeView(id));});
  });
}
// Re-opens a sheet at the same scroll position, so a redraw doesn't jump back to the top.
function keepScroll(fn){const y=$("#sheet").scrollTop;fn();$("#sheet").scrollTop=y;}

      ${orig&&u.used?`<div class="tiny muted" style="margin-top:6px">Used on ${esc(usageText(u))}, so it can be archived but not deleted.</div>`:""}`,sh=>{

        $$("[data-ii]",sh).forEach(el=>{const ing=r.ingredients[+el.dataset.ii],k=el.dataset.ik;if(k==="amount")ing.amount=num(el.value);else if(k==="serving")ing.serving=el.value||null;else if(k==="note")ing.note=el.value.trim();else ing.food=el.value;});};
      const nut=()=>{read();const t=recipeTotals(r);$("#rNut",sh).innerHTML=r.ingredients.length?`<b>${t.inc?"≥ ":""}${fmt(t.kcal,"kcal")} kcal</b>`+activeNuts().map(n=>` · ${esc(n.name)} ${t.n[n.id].inc?"≥ ":""}${fmt(t.n[n.id].v,n.unit)} ${esc(n.unit)}${t.n[n.id].inc?" (incomplete)":""}`).join(""):`<span class="muted">Add ingredients to see nutrition.</span>`;};
      $$("[data-ii]",sh).forEach(el=>{el.onchange=()=>{if(el.dataset.ik==="food"){read();const ing=r.ingredients[+el.dataset.ii];ing.serving=null;draw();}else nut();};if(el.tagName==="INPUT")el.oninput=nut;});
      $("#addIng",sh).onclick=()=>{read();r.ingredients.push({food:"",amount:null,serving:null,note:""});draw();};
      $("#newFoodIng",sh).onclick=()=>{read();pendingRecipeDraft=r;openFoodEditorForRecipe();};
      $$("[data-irm]",sh).forEach(b=>b.onclick=()=>{read();r.ingredients.splice(+b.dataset.irm,1);draw();});
      nut();
      $("#rSave",sh).onclick=()=>{read();const err=validateRecipe(r);if(err){$("#rErr",sh).innerHTML=`<div class="warnbox">${esc(err)}</div>`;return;}saveRecipe(r);render();done();};
      if($("#rCancel",sh))$("#rCancel",sh).onclick=back;
      if($("#rArch",sh))$("#rArch",sh).onclick=()=>{read();const err=validateRecipe(r);if(err){$("#rErr",sh).innerHTML=`<div class="warnbox">${esc(err)}</div>`;return;}r.archived=!r.archived;saveRecipe(r);closeSheet();render();};
      if($("#rShop",sh))$("#rShop",sh).onclick=()=>{read();openAddRecipeToList(r);};
      if($("#rDel",sh)&&!u.used)confirmBtn($("#rDel",sh),"Tap again to delete",()=>{S.recipes=S.recipes.filter(x=>x.id!==r.id);store.del("recipes",r.id);closeSheet();render();});
    });
  };

  openRecipeEditor._redraw=draw;openRecipeEditor._back=back;
}

async function reopenRecipe(draft){
  // Re-open the editor on an unsaved draft.
  const exists=getRecipe(draft.id);
  const tmp=clone(draft);
  if(exists){const saved=clone(exists);Object.assign(exists,tmp);await openRecipeEditor(draft.id,openRecipeEditor._back);Object.assign(exists,saved);}
  else{S.recipes.push(tmp);await openRecipeEditor(tmp.id);S.recipes=S.recipes.filter(x=>x!==tmp);}
}
function validateRecipe(r){
  if(!r.name)return "The name is required.";
  for(const [i,ing] of r.ingredients.entries()){if(!ing.food)return `Ingredient ${i+1} needs a food.`;if(!(ing.amount>0))return `Ingredient ${i+1} (${getFood(ing.food)?.name||""}) needs a positive amount.`;}
  const dup=S.recipes.find(x=>x.id!==r.id&&norm(x.name)===norm(r.name));if(dup)return `You already have a recipe called “${r.name}”${dup.archived?" (archived)":""}.`;
  return null;
}

function targetInputs(t,unit,energy){

}
function readTargets(sh){const t={};$$("[data-tk]",sh).forEach(i=>{const v=num(i.value);t[i.dataset.tk]=v;});return t;}
function targetErr(t){for(const[a,b] of TKEYS){if(t[a]!=null&&t[a]<0||t[b]!=null&&t[b]<0)return "Targets can't be negative.";if(t[a]!=null&&t[b]!=null&&t[a]>t[b])return "A minimum is above its maximum.";}return null;}

function defaultNutrients(){
  return [["fat","Fat",9,{minPct:20,maxPct:35}],["carbs","Carbohydrates",4,{minPct:45,maxPct:60}],["fibre","Fibre",2,{minDay:30}],["protein","Protein",4,{minKg:1.0,maxKg:1.6}]]
    .map(([key,name,kpg,t],i)=>({id:key,key,name,unit:"g",kcalPerGram:kpg,targets:t,archived:false,order:i}));
}
async function readV1(){
  // The first version kept profile, library and day-YYYY-MM-DD documents.
  const out={profile:null,library:null,days:[]};
  if(store.oldCol){
    try{const p=await store.oldCol.doc("profile").get();if(p.exists)out.profile=clone(p.data());}catch(e){}
    try{const l=await store.oldCol.doc("library").get();if(l.exists)out.library=clone(l.data());}catch(e){}
    try{const q=await store.oldCol.where("date",">=","2000-01-01").get();out.days=q.docs.map(d=>clone(d.data())).filter(d=>d&&d.entries);}catch(e){}
  }
  if(!out.profile)out.profile=lsGet("ft:profile");
  if(!out.library)out.library=lsGet("ft:library");
  if(!out.days.length){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("ft:day-")){const v=lsGet(k);if(v&&v.entries)out.days.push(v);}}}catch(e){}}
  return out;
}
async function migrateV1(){
  const v1=await readV1();
  const p=v1.profile;
  if(p){S.settings.age=p.age??null;S.settings.height=p.height??null;S.settings.steps=p.steps??S.settings.steps;S.settings.boulderH=p.boulderH??S.settings.boulderH;
    if(p.weight)S.settings.fallbackWeight=p.weight;
    if(p.goal==="maintain")S.settings.energyTargets={minPct:95,maxPct:105};}
  const map=o=>{const nut={};for(const k of["fat","carbs","protein","fibre"])if(o[k]!=null)nut[k]=+o[k];return nut;};
  for(const lf of v1.library?.foods||[]){
    if(!lf.per100)continue;
    const servings=lf.portion&&lf.portionLabel&&!/^\d+\s*g$/.test(lf.portionLabel)?[{name:lf.portionLabel,amount:lf.portion}]:[];
    const f={id:"f"+uid(),name:lf.name,brand:lf.brand||"",unit:"g",kcalPer100:+lf.per100.kcal||0,servings,nutrients:map(lf.per100),archived:false,barcode:lf.barcode||null,source:"earlier version"};
    if(!S.foods.some(x=>norm(x.name)===norm(f.name)&&norm(x.brand)===norm(f.brand)))saveFood(f);
  }
  for(const d of v1.days){
    const day={date:d.date,weight:null,expended:d.healthKcal>0?d.healthKcal:null,steps:d.steps??null,boulder:!!d.boulder,boulderH:d.boulderH??2,entries:[]};
    for(const e of d.entries){if(!(e.grams>0))continue;const k=100/e.grams;
      const food={id:"f"+uid(),name:e.name,brand:"",unit:"g",kcalPer100:(+e.kcal||0)*k,servings:[],nutrients:map({fat:e.fat*k,carbs:e.carbs*k,protein:e.protein*k,fibre:(e.fibre||0)*k}),archived:true,source:"earlier version"};
      const match=S.foods.find(x=>!x.archived&&norm(x.name)===norm(e.name)&&Math.abs(x.kcalPer100-food.kcalPer100)<1);
      let ref;if(match)ref=match.id;else{food.name=uniqueName(e.name,"",d.date);saveFood(food);ref=food.id;}
      day.entries.push({id:"e"+uid(),kind:"food",ref,amount:Math.round(e.grams*10)/10,serving:null,time:e.t||null});}
    if(day.entries.length||day.expended)saveDay(day);
  }
}
async function boot(){
  let db=null,user=null;
  if(window.claude&&claude.use){
    claude.use("mcp").then(m=>{mcp=m;}).catch(()=>{});
    claude.use("sample").then(async s=>{sample=s;if(s){try{const l=await s.limits();sampleImages=!!(l&&l.images);}catch(e){sampleImages=true;}}});
    try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);}catch(e){}
  }
  if(db&&user){try{const id=await user.id();if(id){store.base=db.doc("data/users/"+id+"/app");store.oldCol=db.collection("data/users/"+id);}}catch(e){}}
  const slow=setTimeout(()=>{if(!S.settings)$("#app").innerHTML=`<div class="loading">Still loading… your data can't be reached yet.</div>`;},10000);
  let nutrients=[],foods=[],recipes=[],lists=[],settings=null;
  try{[nutrients,foods,recipes,lists,settings]=await Promise.all([store.all("nutrients"),store.all("foods"),store.all("recipes"),store.all("lists"),store.get("settings","main")]);}
  catch(e){clearTimeout(slow);$("#app").innerHTML=`<div class="loading">Couldn't load your data. Reload the page to try again.</div>`;return;}
  clearTimeout(slow);
  Object.assign(S,{nutrients,foods,recipes,lists});
  for(const f of S.foods)if(f.photos){delete f.photos;store.put("foods",f.id,f);}
  if(!settings){
    S.settings={energyTargets:{minPct:85,maxPct:100},steps:10000,boulderH:2,age:null,height:null,lastWeight:null,created:Date.now()};
    if(!S.nutrients.length){for(const n of defaultNutrients())saveNut(n);}
    await migrateV1();
    saveSettings();
  }else S.settings=settings;
  try{const from=addDays(today(),-60);const ds_=await store.where("days","date",">=",from);for(const d of ds_)S.days[d.date]=d;S.loadedFrom=from;}catch(e){}
  setPage();
}
boot();
</script>
</body>
</html>
